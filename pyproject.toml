[project]
name = "fernwaerme"
version = "0.1.0"
description = "District heating transformation of an illustrative German city: Python LP/MILP for investment and dispatch, scenario and sensitivity analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "pyarrow>=15", "pyomo>=6.8", "highspy>=1.7", "pyyaml>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
